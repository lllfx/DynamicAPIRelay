<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e3e3e6;--accent:#2f6fde}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--card:#1e1e21;--fg:#ececee;--muted:#9a9aa1;--line:#2e2e33;--accent:#6d9cf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:24px 0 8px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
nav a{padding:4px 10px;border:1px solid var(--line);border-radius:6px;margin-left:4px;color:var(--fg)}
nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.card .k{color:var(--muted);font-size:12px}.card .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.trend{width:100%;height:160px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th:first-child,td:first-child,td.l{text-align:left}
.bad{color:#d64545}.muted{color:var(--muted)}
footer{margin-top:24px;color:var(--muted);font-size:12px}
</style>
</head>
<body><main>
<header>
  <h1>{{template "heading" .}}</h1>
  <nav>{{range .Ranges}}<a href="{{$.BasePath}}?range={{.Name}}"{{if eq .Name $.Range.Name}} class="on"{{end}}>{{.Label}}</a>{{end}}</nav>
</header>
{{template "content" .}}
<footer>统计丢弃 {{num .Dropped}} 条 · 数据保留 {{.RetentionDays}} 天</footer>
</main></body>
</html>
{{define "trend"}}
<div class="panel">
  {{svg .Trend}}
  {{if .Trend}}<div class="axis"><span>{{ts (index .Trend 0).Start}}</span><span>{{ts (index .Trend (len .Trend | add -1)).Start}}</span></div>{{end}}
  <div class="legend"><span><i style="background:#3fa66a"></i>成功</span><span><i style="background:#e0a526"></i>上游错误</span><span><i style="background:#8e6bd1"></i>流中断</span><span><i style="background:#d64545"></i>relay 错误</span></div>
</div>
{{end}}
